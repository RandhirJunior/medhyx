<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- dbt official orange multifaceted diamond mark -->
  <g fill="none" fill-rule="evenodd">
    <!-- Top Face (Light Coral Orange) -->
    <polygon points="50,14 84,33 50,52 16,33" fill="#FF694B"/>
    <!-- Left Face (Medium Rich Orange) -->
    <polygon points="16,33 50,52 50,86 16,67" fill="#F75231"/>
    <!-- Right Face (Dark Terracotta Orange) -->
